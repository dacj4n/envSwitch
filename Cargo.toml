[workspace]
members = [".", "gui/src-tauri"]
default-members = [".", "gui/src-tauri"]

[package]
name = "envswitch"
version = "0.2.0"
edition = "2021"
default-run = "envswitch"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["blocking"] }
bzip2 = "0.5"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
dirs = "6"
tempfile = "3"
thiserror = "2"
indicatif = "0.17"
zip = "2"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
nix = { version = "0.29", features = ["signal", "process"] }
xz2 = "0.1"
