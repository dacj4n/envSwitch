name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
        cache-targets: false

      - run: cargo build --release -p envswitch --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/envswitch package/envswitch
          mkdir -p release
          tar czf release/envswitch-${{ matrix.name }}.tar.gz -C package envswitch

      - name: Checksums
        run: |
          cd release
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 *.tar.gz > checksums.txt
          else
            sha256sum *.tar.gz > checksums.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: envswitch-${{ matrix.name }}
          path: |
            release/envswitch-${{ matrix.name }}.tar.gz
            release/checksums.txt

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - run: ls -R release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
