name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build
        run: cargo build --release -p envswitch --target ${{ matrix.target }}

      - name: Package
        run: |
          binary="target/${{ matrix.target }}/release/envswitch"
          tarball="envswitch-${{ matrix.name }}.tar.gz"

          tar czf "$tarball" -C "$(dirname "$binary")" "$(basename "$binary")"
          shasum -a 256 "$tarball" > "envswitch-${{ matrix.name }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: envswitch-${{ matrix.name }}
          path: |
            envswitch-${{ matrix.name }}.tar.gz
            envswitch-${{ matrix.name }}.sha256

  publish:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
