name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      # 关键：只测试 envswitch package
      - name: Test CLI
        run: cargo test -p envswitch -- --test-threads=1

      # 关键：只构建 envswitch package
      - name: Build CLI
        run: cargo build --release -p envswitch